[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "spde-poisson-filtering"
version = "2.0.0"
description = "Reproducible particle filtering for a 2D stochastic FitzHugh-Nagumo model with Poisson observations"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Jan Szalankiewicz"}]
keywords = ["particle-filter", "SPDE", "Poisson-process", "FitzHugh-Nagumo"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "tqdm>=4.66",
]

[project.optional-dependencies]
demo = ["jupyterlab>=4.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
spde-pf = "spde_poisson_filtering.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spde_poisson_filtering"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
